function saveRegistration(){
 const name=document.getElementById("studentName").value.trim();
 const cls=document.getElementById("studentClass").value;
 const goal=document.getElementById("studentGoal").value.trim();
 const email=document.getElementById("studentEmail").value.trim();
 if(!name || !cls){ alert("Indique ton nom et choisis ta classe."); return; }
 localStorage.setItem("mathsPourTousStudent",JSON.stringify({name,cls,goal,email}));
 alert("Bienvenue sur Maths pour Tous, "+name+" !");
 showCatalog();
}
